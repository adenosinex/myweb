<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>ZIP 资源浏览系统</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { width: 100vw; height: 100vh; overflow: hidden; background: #121212; color: #eee; display: flex; flex-direction: column; }

        /* ================= 通用按钮样式 ================= */
        .btn { padding: 6px 15px; background: #333; color: white; border: 1px solid #555; border-radius: 4px; cursor: pointer; transition: background 0.2s; }
        .btn:hover:not(:disabled) { background: #555; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; border-color: #333; }
        .btn-primary { background: #007acc; border-color: #007acc; }
        .btn-primary:hover:not(:disabled) { background: #0098ff; }

        /* ================= 视图 1：库视图 (搜索与文件夹层级) ================= */
        #libraryView { display: flex; flex-direction: column; height: 100%; }
        .top-bar { padding: 15px 20px; background: #1e1e1e; border-bottom: 1px solid #333; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        
        .breadcrumbs { font-size: 1.1em; display: flex; gap: 8px; align-items: center; flex: 1; }
        .breadcrumb-item { cursor: pointer; color: #aaa; transition: color 0.2s; }
        .breadcrumb-item:hover { color: #fff; text-decoration: underline; }
        .breadcrumb-separator { color: #555; }
        .breadcrumb-current { color: #fff; font-weight: bold; }
        
        .search-box { display: flex; gap: 8px; width: 350px; }
        .search-box input { flex: 1; padding: 8px 12px; background: #2d2d30; border: 1px solid #444; color: white; border-radius: 4px; outline: none; }
        .search-box input:focus { border-color: #007acc; }

        .explorer-grid { flex: 1; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 15px; align-content: start; }
        .file-card { background: #252526; border: 1px solid #333; border-radius: 6px; padding: 15px; cursor: pointer; transition: transform 0.1s, border-color 0.2s; display: flex; flex-direction: column; }
        .file-card:hover { border-color: #007acc; transform: translateY(-2px); }
        .file-icon { font-size: 2.5em; margin-bottom: 10px; }
        .folder-icon { color: #dcb67a; }
        .zip-icon { color: #6fb3d2; }
        .file-name { font-size: 0.95em; word-break: break-all; margin-bottom: 8px; color: #fff; flex: 1; line-height: 1.4; }
        .file-meta { font-size: 0.8em; color: #888; display: flex; justify-content: space-between; border-top: 1px solid #333; padding-top: 8px; }

        /* ================= 视图 2：ZIP 画廊视图 (平铺多张图) ================= */
        #galleryView { display: none; flex-direction: column; height: 100%; background: #0a0a0a; }
        .gallery-header { padding: 10px 20px; background: #1e1e1e; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; flex-shrink: 0; }
        .center-ctrl { display: flex; align-items: center; gap: 15px; flex: 1; justify-content: center; }
        .current-zip-title { font-size: 1.1em; color: #fff; font-weight: bold; max-width: 50vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* 画廊网格：限制最小高度以支持原生懒加载优化性能 */
        .gallery-grid { flex: 1; overflow-y: auto; padding: 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; align-content: start; }
        .thumb-container { background: #1e1e1e; border-radius: 6px; overflow: hidden; cursor: pointer; position: relative; border: 2px solid transparent; transition: border-color 0.2s; height: 350px; display: flex; flex-direction: column; }
        .thumb-container:hover { border-color: #007acc; }
        .thumb-container img { width: 100%; height: 100%; object-fit: cover; flex: 1; min-height: 0; }
        .thumb-title { background: rgba(0,0,0,0.8); color: #ddd; font-size: 12px; padding: 6px 10px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; flex-shrink: 0; }

        /* ================= 视图 3：单图全屏放大阅读器 ================= */
        .viewer-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 1000; display: none; flex-direction: column; }
        .viewer-tools { padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.6); position: absolute; top: 0; width: 100%; z-index: 1001; }
        .viewer-canvas { flex: 1; overflow: hidden; position: relative; display: flex; justify-content: center; align-items: center; cursor: grab; }
        .viewer-canvas:active { cursor: grabbing; }
        #viewerImage { transition: transform 0.1s ease-out; max-width: 100%; max-height: 100%; user-select: none; }
        
        /* 状态提示 */
        #loadingMsg { display: none; padding: 20px; color: #aaa; text-align: center; font-size: 1.2em; flex: 1; align-items: center; justify-content: center; height: 100%; }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #121212; }
        ::-webkit-scrollbar-thumb { background: #444; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #666; }
    </style>
</head>
<body>

    <div id="libraryView">
        <div class="top-bar">
            <div class="breadcrumbs" id="breadcrumbs">
                <span class="breadcrumb-item breadcrumb-current">🏠 首页</span>
            </div>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="搜索 ZIP 名称...">
            </div>
        </div>
        <div class="explorer-grid" id="explorerGrid">
            <div style="padding: 20px; color: #888;">正在加载数据...</div>
        </div>
    </div>

    <div id="galleryView">
        <div class="gallery-header">
            <button class="btn btn-primary" onclick="exitGallery()">← 返回文件夹</button>
            <div class="center-ctrl">
                <button class="btn" id="btnPrevZip" onclick="switchZip(-1)" title="快捷键: W 或 ↑">↑ 上一包</button>
                <div class="current-zip-title" id="currentZipTitle">加载中...</div>
                <button class="btn" id="btnNextZip" onclick="switchZip(1)" title="快捷键: S 或 ↓">↓ 下一包</button>
            </div>
            <div style="width: 100px;"></div> </div>
        
        <div id="loadingMsg">正在解析 ZIP 目录...</div>
        
        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <div id="viewerModal" class="viewer-modal">
        <div class="viewer-tools">
            <span id="viewerCounter" style="color: #ddd;">0 / 0</span>
            <div style="display: flex; gap: 10px;">
                <button class="btn" onclick="resetViewerTransform()">还原缩放</button>
                <button class="btn" onclick="closeViewer()">关闭大图 (Esc)</button>
            </div>
        </div>
        <div class="viewer-canvas" id="viewerCanvas">
            <img id="viewerImage" src="" alt="">
        </div>
    </div>

    <script>
        // ================= 全局状态管理 =================
        let fileSystemTree = { type: 'folder', name: '首页', children: {}, zipCount: 0, imgCount: 0 };
        let allZipsList = [];
        let currentPath = []; 
        
        // 记录搜索与平铺顺序
        let displayedZips = []; 
        let currentZipIndex = -1;  

        let currentZipImages = []; 
        let currentZipName = "";   
        let currentAgentIdx = 0;   
        let currentImgIndex = 0;   

        // 画布缩放拖拽状态
        let scale = 1, translateX = 0, translateY = 0;
        let isDragging = false, startDragX = 0, startDragY = 0;

        document.addEventListener('DOMContentLoaded', loadLibrary);

        // ================= 数据初始化与文件树构建 =================
        function buildFileSystem(zips) {
            let root = { type: 'folder', name: '首页', children: {}, zipCount: 0, imgCount: 0 };
            zips.forEach(z => {
                const parts = z.zip_name.split('/');
                let curr = root;
                curr.zipCount++;
                curr.imgCount += z.count;

                for (let i = 0; i < parts.length - 1; i++) {
                    const folderName = parts[i];
                    if (!curr.children[folderName]) {
                        curr.children[folderName] = { type: 'folder', name: folderName, children: {}, zipCount: 0, imgCount: 0 };
                    }
                    curr = curr.children[folderName];
                    curr.zipCount++;
                    curr.imgCount += z.count;
                }
                const fileName = parts[parts.length - 1];
                curr.children[fileName] = { type: 'file', name: fileName, data: z };
            });
            return root;
        }

        async function loadLibrary() {
            try {
                const res = await fetch('/zipapi/library'); 
                allZipsList = await res.json();
                fileSystemTree = buildFileSystem(allZipsList);
                renderExplorer(currentPath);
            } catch (err) {
                document.getElementById('explorerGrid').innerHTML = `<div style="color:#ff6b6b; padding: 20px;">无法连接到后端接口，请检查服务。</div>`;
            }
        }

        // ================= 视图 1：渲染资源管理器 =================
        function renderExplorer(pathArray) {
            document.getElementById('libraryView').style.display = 'flex';
            document.getElementById('galleryView').style.display = 'none';
            currentPath = pathArray;
            updateBreadcrumbs();

            let currNode = fileSystemTree;
            for (let folder of pathArray) {
                currNode = currNode.children[folder];
            }

            const explorer = document.getElementById('explorerGrid');
            if (!currNode || Object.keys(currNode.children).length === 0) {
                explorer.innerHTML = `<div style="padding: 20px; color:#888; grid-column: 1 / -1;">此文件夹为空</div>`;
                return;
            }

            const items = Object.values(currNode.children).sort((a, b) => {
                if (a.type !== b.type) return a.type === 'folder' ? -1 : 1;
                return a.name.localeCompare(b.name);
            });

            // 维护当前层级的 zip 列表，用于画廊中的上一包/下一包切换
            displayedZips = items.filter(item => item.type === 'file').map(item => item.data);

            explorer.innerHTML = items.map(item => {
                if (item.type === 'folder') {
                    return `
                        <div class="file-card" onclick="enterFolder('${item.name}')">
                            <div class="file-icon folder-icon">📁</div>
                            <div class="file-name">${item.name}</div>
                            <div class="file-meta">
                                <span>子文件: ${item.zipCount}</span>
                                <span>图: ${item.imgCount}</span>
                            </div>
                        </div>
                    `;
                } else {
                    const z = item.data;
                    const zipIndex = displayedZips.indexOf(z);
                    return `
                        <div class="file-card" onclick="openGallery('${z.zip_name}', ${z.agent_idx}, ${zipIndex})">
                            <div class="file-icon zip-icon">📦</div>
                            <div class="file-name" title="${item.name}">${item.name}</div>
                            <div class="file-meta">
                                <span>图片: ${z.count} 张</span>
                            </div>
                        </div>
                    `;
                }
            }).join('');
        }

        function enterFolder(folderName) {
            renderExplorer([...currentPath, folderName]);
        }

        function navigateToBreadcrumb(index) {
            if (index === -1) {
                renderExplorer([]);
            } else {
                renderExplorer(currentPath.slice(0, index + 1));
            }
        }

        function updateBreadcrumbs() {
            const bc = document.getElementById('breadcrumbs');
            let html = `<span class="breadcrumb-item" onclick="navigateToBreadcrumb(-1)">🏠 首页</span>`;
            
            currentPath.forEach((folder, idx) => {
                html += `<span class="breadcrumb-separator">/</span>`;
                html += `<span class="breadcrumb-item" onclick="navigateToBreadcrumb(${idx})">${folder}</span>`;
            });
            bc.innerHTML = html;
        }

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const query = e.target.value.toLowerCase().trim();
            if (!query) {
                renderExplorer(currentPath);
                return;
            }

            // 全局搜索并扁平化展示
            displayedZips = allZipsList.filter(z => z.zip_name.toLowerCase().includes(query));
            document.getElementById('breadcrumbs').innerHTML = `<span class="breadcrumb-current">🔍 搜索结果: ${query}</span>`;

            const explorer = document.getElementById('explorerGrid');
            if (displayedZips.length === 0) {
                explorer.innerHTML = `<div style="padding: 20px; color:#888;">无匹配结果</div>`;
                return;
            }

            explorer.innerHTML = displayedZips.map((z, idx) => `
                <div class="file-card" onclick="openGallery('${z.zip_name}', ${z.agent_idx}, ${idx})">
                    <div class="file-icon zip-icon">📦</div>
                    <div class="file-name" title="${z.zip_name}" style="font-size: 0.85em;">${z.zip_name}</div>
                    <div class="file-meta"><span>包含 ${z.count} 张图</span></div>
                </div>
            `).join('');
        });

        function getImageUrl(zipName, path, agent = 0) {
            return `/zipapi/image?agent=${agent}&zip=${encodeURIComponent(zipName)}&path=${encodeURIComponent(path)}`;
        }

        // ================= 视图 2：渲染 ZIP 内部多图画廊 =================
        async function openGallery(zipName, agentIdx, zipIndexInList) {
            currentZipName = zipName;
            currentAgentIdx = agentIdx !== undefined ? agentIdx : 0;
            currentZipIndex = zipIndexInList;
            
            document.getElementById('libraryView').style.display = 'none';
            document.getElementById('galleryView').style.display = 'flex';
            
            document.getElementById('currentZipTitle').innerText = zipName.split('/').pop();
            document.getElementById('currentZipTitle').title = zipName;
            
            // 更新上下包按钮状态
            document.getElementById('btnPrevZip').disabled = (currentZipIndex <= 0);
            document.getElementById('btnNextZip').disabled = (currentZipIndex >= displayedZips.length - 1);

            document.getElementById('galleryGrid').innerHTML = '';
            document.getElementById('loadingMsg').style.display = 'flex';

            try {
                const res = await fetch(`/zipapi/list?agent=${currentAgentIdx}&zip=${encodeURIComponent(zipName)}`);
                currentZipImages = await res.json();
                
                document.getElementById('loadingMsg').style.display = 'none';
                
                // 渲染大图网格（利用CSS固定高度+lazy懒加载优化性能）
                document.getElementById('galleryGrid').innerHTML = currentZipImages.map((imgPath, idx) => `
                    <div class="thumb-container" onclick="openViewer(${idx})">
                        <img src="${getImageUrl(zipName, imgPath, currentAgentIdx)}" loading="lazy">
                        <div class="thumb-title" title="${imgPath.split('/').pop()}">${imgPath.split('/').pop()}</div>
                    </div>
                `).join('');
            } catch (err) {
                document.getElementById('loadingMsg').innerText = "加载图片列表失败";
            }
        }

        function exitGallery() {
            document.getElementById('galleryView').style.display = 'none';
            document.getElementById('libraryView').style.display = 'flex';
            document.getElementById('galleryGrid').innerHTML = ''; // 释放 DOM 内存
        }

        function switchZip(direction) {
            const nextIdx = currentZipIndex + direction;
            if (nextIdx >= 0 && nextIdx < displayedZips.length) {
                const nextZip = displayedZips[nextIdx];
                openGallery(nextZip.zip_name, nextZip.agent_idx, nextIdx);
            }
        }

        // ================= 视图 3：全屏放大阅读器 =================
        function openViewer(index) {
            currentImgIndex = index;
            document.getElementById('viewerModal').style.display = 'flex';
            resetViewerTransform();
            updateViewerImage();
        }

        function closeViewer() {
            document.getElementById('viewerModal').style.display = 'none';
        }

        function updateViewerImage() {
            if (currentZipImages.length === 0) return;
            const imgPath = currentZipImages[currentImgIndex];
            
            document.getElementById('viewerImage').src = getImageUrl(currentZipName, imgPath, currentAgentIdx);
            document.getElementById('viewerCounter').innerText = `${currentImgIndex + 1} / ${currentZipImages.length} - ${imgPath.split('/').pop()}`;
            
            // 预加载相邻单图
            if (currentImgIndex > 0) {
                new Image().src = getImageUrl(currentZipName, currentZipImages[currentImgIndex - 1], currentAgentIdx);
            }
            if (currentImgIndex < currentZipImages.length - 1) {
                new Image().src = getImageUrl(currentZipName, currentZipImages[currentImgIndex + 1], currentAgentIdx);
            }
        }

        function prevImage() {
            if (currentImgIndex > 0) {
                currentImgIndex--;
                resetViewerTransform();
                updateViewerImage();
            }
        }

        function nextImage() {
            if (currentImgIndex < currentZipImages.length - 1) {
                currentImgIndex++;
                resetViewerTransform();
                updateViewerImage();
            }
        }

        // ================= 大图交互逻辑 (拖拽与缩放) =================
        function resetViewerTransform() {
            scale = 1; translateX = 0; translateY = 0;
            applyTransform();
        }

        function applyTransform() {
            const imgEl = document.getElementById('viewerImage');
            imgEl.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
        }

        const canvas = document.getElementById('viewerCanvas');
        
        canvas.addEventListener('wheel', (e) => {
            if (document.getElementById('viewerModal').style.display !== 'flex') return;
            e.preventDefault();
            const zoomIntensity = 0.15;
            scale += e.deltaY < 0 ? zoomIntensity : -zoomIntensity;
            scale = Math.max(0.1, Math.min(scale, 10)); 
            applyTransform();
        });

        canvas.addEventListener('mousedown', (e) => {
            if (e.target.id !== 'viewerImage') return;
            isDragging = true;
            startDragX = e.clientX - translateX;
            startDragY = e.clientY - translateY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            translateX = e.clientX - startDragX;
            translateY = e.clientY - startDragY;
            applyTransform();
        });

        window.addEventListener('mouseup', () => { isDragging = false; });
        canvas.addEventListener('mouseleave', () => { isDragging = false; });
        
        canvas.addEventListener('dblclick', (e) => {
            if (e.target.id === 'viewerImage') {
                if (scale !== 1) resetViewerTransform();
                else { scale = 2; applyTransform(); }
            }
        });

        // ================= 全局键盘快捷键 =================
        document.addEventListener('keydown', (e) => {
            if (document.activeElement.id === 'searchInput') return;

            // 在单图放大模式下
            if (document.getElementById('viewerModal').style.display === 'flex') {
                if (e.key === 'Escape') closeViewer();
                if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') prevImage();
                if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D' || e.key === ' ') {
                    e.preventDefault(); 
                    nextImage();
                }
            } 
            // 在多图画廊平铺模式下
            else if (document.getElementById('galleryView').style.display === 'flex') {
                if (e.key === 'Escape') {
                    exitGallery();
                }
                if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') {
                    e.preventDefault();
                    switchZip(-1);
                }
                if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') {
                    e.preventDefault();
                    switchZip(1);
                }
            }
        });
    </script>
</body>
</html>
