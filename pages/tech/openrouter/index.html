<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenRouter Model Price Monitor</title>
    <style>
:root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1a1d21;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --green: #059669;
    --amber: #d97706;
    --red: #dc2626;
    --row-hover: #f0f4ff;
    --radius: 8px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
}

.container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px 48px;
}

/* ---------- 顶栏 ---------- */
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { color: var(--accent); font-size: 22px; }
.brand h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
.brand-sub { color: var(--muted); font-weight: 500; }
.actions { display: flex; gap: 8px; }

/* ---------- 按钮 ---------- */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s, border-color .15s, color .15s;
    font-family: inherit;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { background: #a5b8e8; cursor: not-allowed; }
.btn-ghost { background: var(--panel); color: var(--text); border-color: var(--border); }
.btn-ghost:hover { border-color: #c3c9d1; background: #fafbfc; }
.btn-danger { background: #fff; color: var(--red); border-color: var(--border); }
.btn-danger:hover { background: #fef2f2; border-color: #fca5a5; }

/* ---------- 元信息栏 ---------- */
.meta-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 16px;
}
.meta-item { display: flex; flex-direction: column; gap: 2px; }
.meta-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.meta-value { font-size: 13px; font-weight: 550; }

/* 状态徽章 */
.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 20px;
    width: fit-content;
}
.status-badge::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
}
.status-updated { color: var(--green); background: #ecfdf5; }
.status-cached { color: var(--amber); background: #fffbeb; }
.status-error { color: var(--red); background: #fef2f2; }
.status-empty { color: var(--muted); background: #f3f4f6; }

/* 分段选择器 */
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.segmented button {
    border: none; background: var(--panel); padding: 5px 12px;
    font-size: 12px; cursor: pointer; color: var(--muted); font-family: inherit;
}
.segmented button.active { background: var(--accent); color: #fff; }
.segmented button:not(:last-child) { border-right: 1px solid var(--border); }

/* 错误横幅 */
.error-banner {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 13px;
}
.hidden { display: none !important; }

/* ---------- 工具栏 ---------- */
.toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.search {
    flex: 1; max-width: 340px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 13px; font-family: inherit;
    background: var(--panel);
}
.search:focus { outline: none; border-color: var(--accent); }
.count { color: var(--muted); font-size: 12px; }

/* ---------- 表格 ---------- */
.table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
thead th {
    text-align: left;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
}
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { color: var(--text); }
thead th .caret { opacity: .5; font-size: 10px; }
thead th.sorted-asc .caret::after { content: "▲"; opacity: 1; }
thead th.sorted-desc .caret::after { content: "▼"; opacity: 1; }
tbody td { padding: 12px 16px; border-bottom: 1px solid #f0f1f3; vertical-align: top; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--row-hover); }

.cell-model .name { font-weight: 600; }
.cell-model .id { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; }
.cell-price .amount { font-family: var(--mono); font-weight: 600; font-size: 14px; }
.cell-price .cny { font-family: var(--mono); font-size: 12px; color: var(--muted); display: block; }
.cell-price .unit { font-size: 11px; color: var(--muted); }
.cell-ctx { font-family: var(--mono); font-size: 13px; }

/* 行内状态点 */
.dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 550; }
.dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
.dot-ok { color: var(--green); }
.dot-ok::before { background: var(--green); }
.dot-miss { color: var(--red); }
.dot-miss::before { background: var(--red); }

/* 空态 */
.empty { padding: 40px; text-align: center; color: var(--muted); }

/* ---------- 卡片（移动端） ---------- */
.cards { display: none; }
@media (max-width: 720px) {
    .table-wrap { display: none; }
    .cards { display: flex; flex-direction: column; gap: 12px; }
}
.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
}
.card .c-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card .c-name { font-weight: 600; }
.card .c-id { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; margin-top: 2px; }
.card .c-grid { display: flex; gap: 24px; margin-top: 12px; }
.card .c-grid .c-col { display: flex; flex-direction: column; gap: 2px; }
.card .c-grid .c-k { font-size: 11px; color: var(--muted); }
.card .c-grid .c-v { font-family: var(--mono); font-weight: 600; }
.card .c-grid .c-v small { font-weight: 400; color: var(--muted); font-size: 11px; }

/* ---------- 设置页 ---------- */
.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 18px;
}
.panel-title { margin: 0 0 14px; font-size: 15px; font-weight: 650; }
.form { display: flex; flex-direction: column; gap: 12px; }
.form-row { flex-direction: row; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 220px; }
.field-inline { flex: 0; min-width: auto; flex-direction: row; align-items: center; gap: 8px; }
.field label { font-size: 12px; color: var(--muted); }
.field .hint { font-size: 11px; color: #9ca3af; font-weight: 400; }
.field input[type="text"], .field input[type="number"] {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
}
.field input:focus { outline: none; border-color: var(--accent); }
.form-msg { font-size: 13px; margin-top: 8px; }
.form-msg.ok { color: var(--green); }
.form-msg.err { color: var(--red); }

/* 开关 */
.switch { position: relative; display: inline-block; width: 40px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #d1d5db; border-radius: 22px; transition: .2s;
}
.slider::before {
    content: ""; position: absolute; height: 16px; width: 16px;
    left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s;
}
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(18px); }
.switch-label { font-size: 13px; }

/* 模型列表 */
.model-list { display: flex; flex-direction: column; gap: 8px; }
.model-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
}
.model-row .m-info { flex: 1; min-width: 0; }
.model-row .m-name { font-weight: 600; }
.model-row .m-name input {
    font-size: 13px; padding: 2px 6px; border: 1px solid transparent; border-radius: 4px;
    font-family: inherit; width: 100%;
}
.model-row .m-name input:hover, .model-row .m-name input:focus { border-color: var(--border); outline: none; }
.model-row .m-id { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; }
.model-row.disabled { opacity: .55; }
.m-actions { display: flex; gap: 6px; align-items: center; }
.m-actions .btn { padding: 5px 10px; font-size: 12px; }

.footer { margin-top: 28px; text-align: center; color: #9ca3af; font-size: 12px; }

/* ---------- 首页：详情入口 ---------- */
.btn-sm { padding: 4px 10px; font-size: 12px; }
.cell-action { white-space: nowrap; text-align: right; }
.card .c-foot { margin-top: 12px; text-align: right; }

/* ---------- 详情页 ---------- */
.detail-head .d-head-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; flex-wrap: wrap;
}
.detail-head .d-name { margin: 0; font-size: 20px; font-weight: 650; }
.detail-head .d-id { font-family: var(--mono); font-size: 13px; color: var(--muted); word-break: break-all; }
.d-meta { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; }
.d-meta-item { display: inline-flex; gap: 6px; font-size: 12px; color: var(--muted); align-items: baseline; }

/* 键值网格 */
.kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px 24px; }
.kv-item { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-bottom: 1px solid #f0f1f3; }
.kv-k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.kv-v { font-size: 14px; font-weight: 550; word-break: break-all; }
.kv-v .muted, .muted { color: var(--muted); font-size: 12px; font-weight: 400; }

.d-sub { font-size: 12px; color: var(--muted); margin: 16px 0 8px; font-weight: 600; }
.d-desc { font-size: 13px; color: var(--text); margin: 4px 0 0; line-height: 1.6; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
    font-family: var(--mono); font-size: 12px;
    background: #f0f4ff; color: var(--accent);
    border: 1px solid #dbe4ff; border-radius: 6px;
    padding: 2px 8px;
}

/* 统计卡片 */
.stat-cards { display: flex; flex-wrap: wrap; gap: 12px; }
.stat-card {
    flex: 1; min-width: 150px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
}
.stat-k { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.stat-v { font-family: var(--mono); font-size: 16px; font-weight: 650; }
.stat-v .cny { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }

.unit-note { font-size: 12px; color: var(--muted); font-weight: 400; }

/* 可横向滚动表格（移动端） */
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.kv-table { min-width: 320px; }
.kv-table th, .kv-table td { padding: 10px 12px; }
.kv-table td:last-child { font-family: var(--mono); }

.d-unavailable {
    background: #f8fafc; border: 1px dashed var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    color: var(--muted); font-size: 13px;
}
.d-note { font-size: 12px; color: #9ca3af; margin: 10px 0 0; }
.d-foot { margin-top: 16px; }

/* ---------- Provider 详情表格 ---------- */
.p-baseline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.p-baseline select {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 13px; font-family: inherit; background: var(--panel);
}
.p-baseline select:focus { outline: none; border-color: var(--accent); }
.p-base-name { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); }

.provider-table { min-width: 760px; }
.provider-table th { white-space: nowrap; }
.provider-table td { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
.provider-table td.p-name { font-family: var(--sans); }
.provider-table tr.is-base { background: #f0f6ff; }
.provider-table tr.is-base td.p-name .p-name-text { font-weight: 700; }

.p-name-text { font-weight: 600; }
.badge-base {
    display: inline-block; margin-left: 6px;
    font-family: var(--sans); font-size: 10px; font-weight: 700;
    color: #fff; background: var(--accent); border-radius: 4px; padding: 1px 6px;
    vertical-align: middle; letter-spacing: .03em;
}
.qtag {
    display: inline-block; margin-left: 6px;
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    background: #f3f4f6; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px;
    vertical-align: middle;
}

/* 价格差异百分比（更便宜=绿，更贵=红） */
.diff { font-family: var(--mono); font-size: 11px; margin-left: 4px; }
.diff-neg { color: var(--green); }
.diff-pos { color: var(--red); }
.diff-zero { color: var(--muted); }

.dot-warn { color: var(--amber); }
.dot-warn::before { background: var(--amber); }

@media (max-width: 720px) {
    .kv-grid { grid-template-columns: 1fr; }
    .stat-cards { flex-direction: column; }
}

</style>
</head>
<body>
    <div class="container">
        <header class="topbar">
            <div class="brand">
                <span class="logo">◈</span>
                <h1>OpenRouter <span class="brand-sub">Model Price Monitor</span></h1>
            </div>
            <div class="actions">
                <button id="btn-refresh" class="btn btn-primary">立即刷新</button>
                <a href="/openrouter/settings.html" class="btn btn-ghost">模型管理</a>
            </div>
        </header>

        <section class="meta-bar" id="meta-bar">
            <div class="meta-item">
                <span class="meta-label">数据状态</span>
                <span class="status-badge" id="status-badge">加载中…</span>
            </div>
            <div class="meta-item">
                <span class="meta-label">数据来源</span>
                <span class="meta-value" id="meta-source">OpenRouter Official API</span>
            </div>
            <div class="meta-item">
                <span class="meta-label">最后更新</span>
                <span class="meta-value" id="meta-updated">—</span>
            </div>
            <div class="meta-item">
                <span class="meta-label">汇率</span>
                <span class="meta-value" id="meta-rate">1 USD ≈ ¥7.2</span>
            </div>
            <div class="meta-item">
                <span class="meta-label">显示</span>
                <div class="segmented" id="currency-mode">
                    <button data-mode="usd">USD</button>
                    <button data-mode="both" class="active">USD+CNY</button>
                    <button data-mode="cny">CNY</button>
                </div>
            </div>
        </section>

        <div class="error-banner hidden" id="error-banner"></div>

        <section class="toolbar">
            <input type="search" id="search" class="search" placeholder="搜索模型名称 / ID…">
            <span class="count" id="count">0 个模型</span>
        </section>

        <section class="table-wrap">
            <table id="price-table">
                <thead>
                    <tr>
                        <th data-sort="name" class="sortable">模型 <span class="caret"></span></th>
                        <th data-sort="input" class="sortable">输入 <span class="caret"></span></th>
                        <th data-sort="output" class="sortable">输出 <span class="caret"></span></th>
                        <th>Context</th>
                        <th>状态</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
            <div class="empty hidden" id="empty">暂无模型数据</div>
        </section>

        <section class="cards" id="cards"></section>

        <footer class="footer">
            <span>数据源：OpenRouter Official API · 仅本地部署 · 价格单位 USD / 1M tokens</span>
        </footer>
    </div>

    <button onclick="history.back()" class="btn btn-ghost">返回上一页</button>
    <script>
/* OpenRouter Price Monitor — 首页逻辑（原生 JS，无任何外部依赖） */
(function () {
    "use strict";

    // 蓝图 URL 前缀（形如 "/openrouter/"），由模板注入；缺失时回退到 "/"
    var BASE = window.BASE_PATH || "/openrouter/";

    var state = {
        models: [],        // 后端合并后的模型数组
        rate: 7.2,         // USD/CNY 汇率
        status: "empty",
        updatedAt: null,
        lastError: null,
        source: "OpenRouter Official API",
        currencyMode: "both", // usd | cny | both
        search: "",
        sortKey: "name",
        sortDir: 1,
        refreshBusy: false,
    };

    var els = {
        tableBody: document.getElementById("table-body"),
        cards: document.getElementById("cards"),
        empty: document.getElementById("empty"),
        count: document.getElementById("count"),
        statusBadge: document.getElementById("status-badge"),
        metaUpdated: document.getElementById("meta-updated"),
        metaRate: document.getElementById("meta-rate"),
        metaSource: document.getElementById("meta-source"),
        errorBanner: document.getElementById("error-banner"),
        search: document.getElementById("search"),
        refreshBtn: document.getElementById("btn-refresh"),
        currencyMode: document.getElementById("currency-mode"),
    };

    /* ---------- 工具函数 ---------- */
    function $(sel) { return document.querySelector(sel); }

    function fmtUsd(v) {
        if (v === null || v === undefined || isNaN(v)) return "—";
        if (v === 0) return "$0";
        if (v < 0.001) return "$" + v.toExponential(2);
        if (v < 1) return "$" + v.toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
        return "$" + v.toFixed(2);
    }

    function fmtCny(v) {
        if (v === null || v === undefined || isNaN(v)) return "—";
        var c = v * state.rate;
        if (c < 0.01) return "¥" + c.toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
        return "¥" + c.toFixed(2);
    }

    function fmtCtx(n) {
        if (n === null || n === undefined) return "—";
        if (n >= 1e6) return trimZero(n / 1e6) + "M";
        if (n >= 1e3) return trimZero(n / 1e3) + "K";
        return String(n);
    }
    function trimZero(x) {
        return x.toFixed(x >= 100 ? 0 : 1).replace(/\.0$/, "");
    }

    function fmtTime(iso) {
        if (!iso) return "—";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        var p = function (n) { return (n < 10 ? "0" : "") + n; };
        return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
            " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    }

    function priceCell(v) {
        // 返回价格单元格的 HTML 字符串（数值已由后端换算，前端仅做展示，不拼接未处理内容）
        if (v === null || v === undefined) {
            return '<span class="amount">—</span><span class="unit">/ 1M tokens</span>';
        }
        var html = '<span class="amount">' + escapeHtml(fmtUsd(v)) + '</span>';
        if (state.currencyMode === "cny") {
            html = '<span class="amount">' + escapeHtml(fmtCny(v)) + '</span>';
        } else if (state.currencyMode === "both") {
            html += '<span class="cny">≈ ' + escapeHtml(fmtCny(v)) + '</span>';
        }
        html += '<span class="unit">/ 1M tokens</span>';
        return html;
    }

    function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    /* ---------- 状态徽章 ---------- */
    function renderBadge() {
        var map = {
            updated: { text: "Updated", cls: "status-updated" },
            cached: { text: "Cached", cls: "status-cached" },
            error: { text: "Error", cls: "status-error" },
            empty: { text: "Empty", cls: "status-empty" },
        };
        var m = map[state.status] || map.empty;
        els.statusBadge.textContent = m.text;
        els.statusBadge.className = "status-badge " + m.cls;
    }

    function renderMeta() {
        els.metaUpdated.textContent = fmtTime(state.updatedAt);
        els.metaRate.textContent = "1 USD ≈ ¥" + state.rate;
        els.metaSource.textContent = state.source || "OpenRouter Official API";

        if (state.status === "cached" || state.status === "error") {
            var msg = "OpenRouter 当前无法访问";
            if (state.lastError) msg += "：" + state.lastError;
            if (state.updatedAt) msg += "。当前显示缓存数据（最后更新 " + fmtTime(state.updatedAt) + "）";
            else msg += "，且暂无可用缓存数据。";
            els.errorBanner.textContent = msg;
            els.errorBanner.classList.remove("hidden");
        } else {
            els.errorBanner.classList.add("hidden");
        }
    }

    /* ---------- 排序 / 搜索 ---------- */
    function visibleModels() {
        var q = state.search.trim().toLowerCase();
        var list = state.models.filter(function (m) {
            return m.enabled;
        });
        if (q) {
            list = list.filter(function (m) {
                return (m.name || "").toLowerCase().indexOf(q) >= 0 ||
                    (m.id || "").toLowerCase().indexOf(q) >= 0;
            });
        }
        var key = state.sortKey, dir = state.sortDir;
        list.sort(function (a, b) {
            var va, vb;
            if (key === "name") { va = (a.name || "").toLowerCase(); vb = (b.name || "").toLowerCase(); }
            else { va = a[key + "_price"]; vb = b[key + "_price"]; va = va === null ? -Infinity : va; vb = vb === null ? -Infinity : vb; }
            if (va < vb) return -1 * dir;
            if (va > vb) return 1 * dir;
            return 0;
        });
        return list;
    }

    function renderTable() {
        var list = visibleModels();
        els.count.textContent = list.length + " 个模型";
        if (list.length === 0) {
            els.tableBody.innerHTML = "";
            els.empty.textContent = state.search ? "没有匹配的模型" : "暂无模型数据";
            els.empty.classList.remove("hidden");
            renderCards([]);
            return;
        }
        els.empty.classList.add("hidden");

        var rows = list.map(function (m) {
            var statusHtml = m.found
                ? '<span class="dot dot-ok">正常</span>'
                : '<span class="dot dot-miss" title="模型未在 OpenRouter API 中找到">未找到</span>';
            return '<tr>' +
                '<td class="cell-model"><div class="name">' + escapeHtml(m.name) + '</div>' +
                '<div class="id">' + escapeHtml(m.id) + '</div></td>' +
                '<td class="cell-price">' + priceCell(m.input_price) + '</td>' +
                '<td class="cell-price">' + priceCell(m.output_price) + '</td>' +
                '<td class="cell-ctx">' + escapeHtml(fmtCtx(m.context_length)) + '</td>' +
                '<td>' + statusHtml + '</td>' +
                '<td class="cell-action"><a class="btn btn-ghost btn-sm" href="' + BASE + 'model/' + escapeHtml(m.id) + '">详情</a></td>' +
                '</tr>';
        });
        els.tableBody.innerHTML = rows.join("");
        renderCards(list);
    }

    function renderCards(list) {
        if (list.length === 0) { els.cards.innerHTML = ""; return; }
        els.cards.innerHTML = list.map(function (m) {
            var statusHtml = m.found
                ? '<span class="dot dot-ok">正常</span>'
                : '<span class="dot dot-miss">未找到</span>';
            return '<div class="card">' +
                '<div class="c-head"><div><div class="c-name">' + escapeHtml(m.name) + '</div>' +
                '<div class="c-id">' + escapeHtml(m.id) + '</div></div>' + statusHtml + '</div>' +
                '<div class="c-grid">' +
                '<div class="c-col"><span class="c-k">输入</span><span class="c-v">' + escapeHtml(fmtUsd(m.input_price)) + ' <small>/1M</small></span></div>' +
                '<div class="c-col"><span class="c-k">输出</span><span class="c-v">' + escapeHtml(fmtUsd(m.output_price)) + ' <small>/1M</small></span></div>' +
                '<div class="c-col"><span class="c-k">Context</span><span class="c-v">' + escapeHtml(fmtCtx(m.context_length)) + '</span></div>' +
                '</div>' +
                '<div class="c-foot"><a class="btn btn-ghost btn-sm" href="' + BASE + 'model/' + escapeHtml(m.id) + '">详情 →</a></div>' +
                '</div>';
        }).join("");
    }

    function updateSortHeaders() {
        document.querySelectorAll("th.sortable").forEach(function (th) {
            th.classList.remove("sorted-asc", "sorted-desc");
            if (th.getAttribute("data-sort") === state.sortKey) {
                th.classList.add(state.sortDir === 1 ? "sorted-asc" : "sorted-desc");
            }
        });
    }

    function render() {
        renderBadge();
        renderMeta();
        renderTable();
        updateSortHeaders();
    }

    /* ---------- 数据加载 ---------- */
    function load() {
        fetch(BASE + "api/models").then(function (r) { return r.json(); }).then(function (data) {
            state.models = data.models || [];
            state.rate = data.usd_cny_rate != null ? data.usd_cny_rate : 7.2;
            state.status = data.status || "empty";
            state.updatedAt = data.updated_at || null;
            state.lastError = data.last_error || null;
            state.source = data.source || "OpenRouter Official API";
            render();
        }).catch(function () {
            state.status = "error";
            state.lastError = "无法连接本地服务";
            render();
        });
    }

    /* ---------- 事件 ---------- */
    els.refreshBtn.addEventListener("click", function () {
        if (state.refreshBusy) return;
        state.refreshBusy = true;
        els.refreshBtn.disabled = true;
        els.refreshBtn.textContent = "刷新中…";
        fetch(BASE + "api/refresh", { method: "POST" }).then(function (r) {
            if (r.status === 429) {
                return r.json().then(function (d) { throw new Error(d.error || "刷新过于频繁"); });
            }
            return r.json();
        }).then(function (data) {
            if (data && data.models) {
                state.models = data.models || [];
                state.rate = data.usd_cny_rate != null ? data.usd_cny_rate : state.rate;
                state.status = data.status || "updated";
                state.updatedAt = data.updated_at || state.updatedAt;
                state.lastError = data.last_error || null;
                render();
            } else {
                load();
            }
        }).catch(function (err) {
            alert(err.message || "刷新失败");
        }).finally(function () {
            state.refreshBusy = false;
            els.refreshBtn.disabled = false;
            els.refreshBtn.textContent = "立即刷新";
        });
    });

    els.search.addEventListener("input", function () {
        state.search = els.search.value;
        renderTable();
    });

    document.querySelectorAll("th.sortable").forEach(function (th) {
        th.addEventListener("click", function () {
            var key = th.getAttribute("data-sort");
            if (state.sortKey === key) {
                state.sortDir = -state.sortDir;
            } else {
                state.sortKey = key;
                state.sortDir = (key === "name") ? 1 : -1;
            }
            renderTable();
            updateSortHeaders();
        });
    });

    els.currencyMode.addEventListener("click", function (e) {
        var btn = e.target.closest("button");
        if (!btn) return;
        state.currencyMode = btn.getAttribute("data-mode");
        els.currencyMode.querySelectorAll("button").forEach(function (b) {
            b.classList.toggle("active", b === btn);
        });
        renderTable();
    });

    load();
})();

</script>
</body>
</html>
