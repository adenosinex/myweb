<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OpenRouter 模型价格监控</title>
<style>
:root {
  --bg: #f6f7f9;
  --panel: #fff;
  --border: #e3e6ea;
  --text: #1a1d21;
  --muted: #6b7280;
  --accent: #2563eb;
  --green: #059669;
  --red: #dc2626;
  --amber: #d97706;
  --radius: 8px;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 14px;
  line-height: 1.5;
}
.container { max-width: 1100px; margin: 0 auto; padding: 24px 20px 48px; }

/* 顶栏 */
.topbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 20px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { color: var(--accent); font-size: 22px; }
.brand h1 { font-size: 20px; margin: 0; }
.brand span.sub { color: var(--muted); font-weight: 400; font-size: 16px; }
.actions { display: flex; gap: 8px; }

/* 按钮 */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: var(--radius);
  border: 1px solid transparent; font-size: 13px; cursor: pointer;
  text-decoration: none; font-family: inherit;
  transition: background .15s, border-color .15s;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: #1d4ed8; }
.btn-primary:disabled { opacity: .6; cursor: not-allowed; }
.btn-ghost { background: var(--panel); color: var(--text); border-color: var(--border); }
.btn-ghost:hover { border-color: #c3c9d1; background: #fafbfc; }
.btn-sm { padding: 4px 10px; font-size: 12px; }

/* 元信息栏 */
.meta-bar { display: flex; flex-wrap: wrap; gap: 20px; align-items: center; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px; }
.meta-item { display: flex; flex-direction: column; gap: 2px; }
.meta-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.meta-value { font-size: 13px; font-weight: 550; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 10px; border-radius: 20px; width: fit-content; }
.badge::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.badge-updated { color: var(--green); background: #ecfdf5; }
.badge-cached { color: var(--amber); background: #fffbeb; }
.badge-error { color: var(--red); background: #fef2f2; }
.badge-empty { color: var(--muted); background: #f3f4f6; }

/* 错误提示 */
.error-banner { background: #fef2f2; border: 1px solid #fecaca; color: #b91c1c; border-radius: var(--radius); padding: 10px 14px; margin-bottom: 16px; font-size: 13px; }
.hidden { display: none !important; }

/* 工具栏 */
.toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.search { flex: 1; max-width: 340px; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius); font-size: 13px; font-family: inherit; background: var(--panel); }
.search:focus { outline: none; border-color: var(--accent); }
.count { color: var(--muted); font-size: 12px; }

/* 分段选择器 */
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.segmented button { border: none; background: var(--panel); padding: 5px 12px; font-size: 12px; cursor: pointer; color: var(--muted); font-family: inherit; }
.segmented button.active { background: var(--accent); color: #fff; }
.segmented button:not(:last-child) { border-right: 1px solid var(--border); }

/* 表格 */
.table-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
thead th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; padding: 12px 16px; border-bottom: 1px solid var(--border); white-space: nowrap; cursor: pointer; user-select: none; }
thead th.sorted-asc::after { content: " ▲"; }
thead th.sorted-desc::after { content: " ▼"; }
tbody td { padding: 12px 16px; border-bottom: 1px solid #f0f1f3; vertical-align: top; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: #f0f4ff; }
.cell-model .name { font-weight: 600; }
.cell-model .id { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; }
.price { font-family: var(--mono); font-weight: 600; }
.cny { display: block; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.ctx { font-family: var(--mono); }
.dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 550; }
.dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.dot-ok { color: var(--green); }
.dot-miss { color: var(--red); }
.dot-disabled { color: var(--muted); }

/* 模型名链接样式 */
.cell-model .name a,
.card .c-name a {
  color: inherit;
  text-decoration: none;
  transition: color .15s;
}
.cell-model .name a:hover,
.card .c-name a:hover {
  color: var(--accent);
  text-decoration: underline;
}

/* 移动端卡片 */
.cards { display: none; }
@media (max-width: 720px) {
  .table-wrap { display: none; }
  .cards { display: flex; flex-direction: column; gap: 12px; }
}
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; }
.card .c-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card .c-name { font-weight: 600; }
.card .c-id { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; margin-top: 2px; }
.card .c-grid { display: flex; gap: 24px; margin-top: 12px; flex-wrap: wrap; }
.card .c-col { display: flex; flex-direction: column; gap: 2px; }
.card .c-k { font-size: 11px; color: var(--muted); }
.card .c-v { font-family: var(--mono); font-weight: 600; }
.card .c-v small { font-weight: 400; color: var(--muted); font-size: 11px; }
.card .c-foot { margin-top: 12px; text-align: right; }

.empty { padding: 40px; text-align: center; color: var(--muted); }
.footer { margin-top: 28px; text-align: center; color: #9ca3af; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <header class="topbar">
    <div class="brand">
      <span class="logo">◈</span>
      <h1>OpenRouter <span class="sub">模型价格监控</span></h1>
    </div>
    <div class="actions">
      <button id="btn-refresh" class="btn btn-primary">立即刷新</button>
      <a href="settings.html" class="btn btn-ghost">模型管理</a>
    </div>
  </header>

  <section class="meta-bar">
    <div class="meta-item">
      <span class="meta-label">数据状态</span>
      <span id="status-badge" class="badge badge-empty">加载中…</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">数据来源</span>
      <span class="meta-value" id="meta-source">OpenRouter 官方 API</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">最后更新</span>
      <span class="meta-value" id="meta-updated">—</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">汇率</span>
      <span class="meta-value" id="meta-rate">1 USD ≈ ¥7.2</span>
    </div>
    <div class="meta-item">
      <span class="meta-label">显示</span>
      <div class="segmented" id="currency-mode">
        <button data-mode="usd">美元</button>
        <button data-mode="both">美元+人民币</button>
        <button data-mode="cny" class="active">人民币</button>
      </div>
    </div>
  </section>

  <div id="error-banner" class="error-banner hidden"></div>

  <section class="toolbar">
    <input type="search" id="search" class="search" placeholder="搜索模型名称 / ID…">
    <span id="count" class="count">0 个模型</span>
  </section>

  <section class="table-wrap">
    <table>
      <thead>
        <tr>
          <th data-sort="name">模型</th>
          <th data-sort="input_price">输入</th>
          <th data-sort="output_price">输出</th>
          <th data-sort="cache_read_price">缓存读</th>
          <th data-sort="context_length">上下文</th>
          <th>状态</th>
          <th></th>
        </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
    <div id="empty" class="empty hidden">暂无模型数据</div>
  </section>

  <section id="cards" class="cards"></section>

  <footer class="footer">
    <span>数据源：OpenRouter 官方 API · 仅本地部署 · 价格单位 人民币 / 1M tokens（由美元按汇率换算）</span>
  </footer>
</div>

<script>
(function () {
  "use strict";

  /* ========== 配置 ========== */
  // 固定的 OpenRouter 路径前缀（与后端部署保持一致）
  const BASE = "/openrouter/";

  // 路径拼接辅助函数：确保 BASE 与子路径之间只有一个斜杠
  const api = (path) => {
    const base = BASE.replace(/\/+$/, '');
    const p = path.replace(/^\/+/, '');
    return `${base}/${p}`;
  };

  /* ========== 全局状态 ========== */
  const state = {
    models: [],
    rate: 7.2,
    status: 'empty',        // updated | cached | error | empty
    updatedAt: null,
    lastError: null,
    source: 'OpenRouter 官方 API',
    currencyMode: 'cny',    // 美元 | 美元+人民币 | 人民币
    search: '',
    sortKey: 'name',
    sortDir: 1,
    refreshBusy: false,
  };

  /* ========== DOM 引用 ========== */
  const $ = (sel) => document.querySelector(sel);
  const els = {
    tbody: $('#tbody'),
    cards: $('#cards'),
    empty: $('#empty'),
    count: $('#count'),
    badge: $('#status-badge'),
    metaUpdated: $('#meta-updated'),
    metaRate: $('#meta-rate'),
    metaSource: $('#meta-source'),
    errorBanner: $('#error-banner'),
    search: $('#search'),
    refreshBtn: $('#btn-refresh'),
    currencyMode: $('#currency-mode'),
  };

  /* ========== 工具函数 ========== */
  const escapeHtml = (s) => String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));

  const translateSource = (s) => s === 'OpenRouter Official API' ? 'OpenRouter 官方 API' : (s || 'OpenRouter 官方 API');

  // 生成 OpenRouter 模型页面链接，保留 ID 中的斜杠（如 provider/model）
  const openRouterModelUrl = (m) => {
    const id = (m.id || '').trim();
    if (!id) return 'https://openrouter.ai/models';
    const segments = id.split('/').map(encodeURIComponent).join('/');
    return 'https://openrouter.ai/models/' + segments;
  };

  const fmtUsd = (v) => {
    if (v == null || isNaN(v)) return '—';
    if (v === 0) return '$0';
    if (v < 0.001) return '$' + v.toExponential(2);
    if (v < 1) return '$' + v.toFixed(3).replace(/0+$/, '').replace(/\.$/, '');
    return '$' + v.toFixed(2);
  };

  const fmtCny = (v) => {
    if (v == null || isNaN(v)) return '—';
    const c = v * state.rate;
    if (c < 0.01) return '¥' + c.toFixed(4).replace(/0+$/, '').replace(/\.$/, '');
    return '¥' + c.toFixed(2);
  };

  const fmtCtx = (n) => {
    if (n == null) return '—';
    if (n >= 1e6) return (n / 1e6).toFixed(1).replace(/\.0$/, '') + 'M';
    if (n >= 1e3) return (n / 1e3).toFixed(1).replace(/\.0$/, '') + 'K';
    return String(n);
  };

  const fmtTime = (iso) => {
    if (!iso) return '—';
    const d = new Date(iso);
    if (isNaN(d.getTime())) return iso;
    const p = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}:${p(d.getSeconds())}`;
  };

  const priceHtml = (v) => {
    if (v == null) return '<span class="price">—</span><br><small>每 1M tokens</small>';
    let html = `<span class="price">${escapeHtml(fmtUsd(v))}</span>`;
    if (state.currencyMode === 'both') {
      html += `<span class="cny">≈ ${escapeHtml(fmtCny(v))}</span>`;
    } else if (state.currencyMode === 'cny') {
      html = `<span class="price">${escapeHtml(fmtCny(v))}</span>`;
      html += `<span class="cny">每 1M tokens</span>`;
    }
    if (state.currencyMode !== 'cny') html += '<small>每 1M tokens</small>';
    return html;
  };

  const cardPrice = (v) => {
    if (v == null) return '—';
    if (state.currencyMode === 'cny') {
      return `${escapeHtml(fmtCny(v))} <small>每1M</small>`;
    }
    if (state.currencyMode === 'both') {
      return `${escapeHtml(fmtUsd(v))} <small>≈ ${escapeHtml(fmtCny(v))} /1M</small>`;
    }
    return `${escapeHtml(fmtUsd(v))} <small>每1M</small>`;
  };

  const statusHtml = (m) => {
    if (!m.enabled) return '<span class="dot dot-disabled">已禁用</span>';
    if (m.found) return '<span class="dot dot-ok">正常</span>';
    return '<span class="dot dot-miss">未找到</span>';
  };

  const detailUrl = (m) => `${BASE}detail.html?id=${encodeURIComponent(m.id)}`;

  /* ========== 获取可见模型（搜索 + 排序） ========== */
  const getVisibleModels = () => {
    const q = state.search.trim().toLowerCase();
    let list = state.models.filter(m => m.enabled !== false);   // 默认只看启用的模型
    if (q) {
      list = list.filter(m =>
        (m.name || '').toLowerCase().includes(q) ||
        (m.id || '').toLowerCase().includes(q)
      );
    }
    const key = state.sortKey;
    const dir = state.sortDir;
    list.sort((a, b) => {
      let va, vb;
      if (key === 'name') {
        va = (a.name || '').toLowerCase();
        vb = (b.name || '').toLowerCase();
      } else {
        va = a[key] ?? -Infinity;
        vb = b[key] ?? -Infinity;
      }
      if (va < vb) return -1 * dir;
      if (va > vb) return 1 * dir;
      return 0;
    });
    return list;
  };

  /* ========== 渲染 ========== */
  const render = () => {
    // 状态徽章
    const badgeMap = {
      updated: ['已更新', 'badge-updated'],
      cached: ['缓存', 'badge-cached'],
      error: ['错误', 'badge-error'],
      empty: ['空', 'badge-empty'],
    };
    const [text, cls] = badgeMap[state.status] || badgeMap.empty;
    els.badge.textContent = text;
    els.badge.className = `badge ${cls}`;

    // 元信息
    els.metaUpdated.textContent = fmtTime(state.updatedAt);
    els.metaRate.textContent = `1 USD ≈ ¥${state.rate}`;
    els.metaSource.textContent = state.source || 'OpenRouter 官方 API';

    // 错误横幅
    if (state.status === 'error' || state.status === 'cached') {
      let msg = 'OpenRouter 当前无法访问';
      if (state.lastError) msg += `：${state.lastError}`;
      if (state.updatedAt) msg += `。当前显示缓存数据（最后更新 ${fmtTime(state.updatedAt)}）`;
      else msg += '，且暂无可用缓存数据。';
      els.errorBanner.textContent = msg;
      els.errorBanner.classList.remove('hidden');
    } else {
      els.errorBanner.classList.add('hidden');
    }

    // 表格 / 卡片
    const list = getVisibleModels();
    els.count.textContent = `${list.length} 个模型`;

    if (list.length === 0) {
      els.tbody.innerHTML = '';
      els.cards.innerHTML = '';
      els.empty.textContent = state.search ? '没有匹配的模型' : '暂无模型数据';
      els.empty.classList.remove('hidden');
      return;
    }
    els.empty.classList.add('hidden');

    els.tbody.innerHTML = list.map(m => `
      <tr>
        <td class="cell-model">
          <div class="name">
            <a href="${escapeHtml(openRouterModelUrl(m))}" target="_blank" rel="noopener noreferrer">${escapeHtml(m.name)}</a>
          </div>
          <div class="id">${escapeHtml(m.id)}</div>
        </td>
        <td>${priceHtml(m.input_price)}</td>
        <td>${priceHtml(m.output_price)}</td>
        <td>${priceHtml(m.cache_read_price)}</td>
        <td class="ctx">${escapeHtml(fmtCtx(m.context_length))}</td>
        <td>${statusHtml(m)}</td>
        <td><a class="btn btn-ghost btn-sm" href="${detailUrl(m)}">详情</a></td>
      </tr>
    `).join('');

    els.cards.innerHTML = list.map(m => `
      <div class="card">
        <div class="c-head">
          <div>
            <div class="c-name">
              <a href="${escapeHtml(openRouterModelUrl(m))}" target="_blank" rel="noopener noreferrer">${escapeHtml(m.name)}</a>
            </div>
            <div class="c-id">${escapeHtml(m.id)}</div>
          </div>
          ${statusHtml(m)}
        </div>
        <div class="c-grid">
          <div class="c-col"><span class="c-k">输入</span><span class="c-v">${cardPrice(m.input_price)}</span></div>
          <div class="c-col"><span class="c-k">输出</span><span class="c-v">${cardPrice(m.output_price)}</span></div>
          <div class="c-col"><span class="c-k">缓存读</span><span class="c-v">${cardPrice(m.cache_read_price)}</span></div>
          <div class="c-col"><span class="c-k">上下文长度</span><span class="c-v">${escapeHtml(fmtCtx(m.context_length))}</span></div>
        </div>
        <div class="c-foot"><a class="btn btn-ghost btn-sm" href="${detailUrl(m)}">详情 →</a></div>
      </div>
    `).join('');

    // 排序指示
    document.querySelectorAll('th[data-sort]').forEach(th => {
      th.classList.remove('sorted-asc', 'sorted-desc');
      if (th.dataset.sort === state.sortKey) {
        th.classList.add(state.sortDir === 1 ? 'sorted-asc' : 'sorted-desc');
      }
    });
  };

  /* ========== 数据加载 ========== */
  const loadModels = async () => {
    try {
      const res = await fetch(api('api/models'));
      const data = await res.json();
      state.models = data.models || [];
      state.rate = data.usd_cny_rate ?? 7.2;
      state.status = data.status || 'empty';
      state.updatedAt = data.updated_at || null;
      state.lastError = data.last_error || null;
      state.source = translateSource(data.source);
    } catch (err) {
      state.status = 'error';
      state.lastError = '无法连接本地服务';
    }
    render();
  };

  /* ========== 刷新 ========== */
  const refresh = async () => {
    if (state.refreshBusy) return;
    state.refreshBusy = true;
    els.refreshBtn.disabled = true;
    els.refreshBtn.textContent = '刷新中…';
    try {
      const res = await fetch(api('api/refresh'), { method: 'POST' });
      if (res.status === 429) {
        const d = await res.json();
        throw new Error(d.error || '刷新过于频繁');
      }
      const data = await res.json();
      if (data?.models) {
        state.models = data.models || [];
        state.rate = data.usd_cny_rate ?? state.rate;
        state.status = data.status || 'updated';
        state.updatedAt = data.updated_at || state.updatedAt;
        state.lastError = data.last_error || null;
        if (data.source) state.source = translateSource(data.source);
        render();
      } else {
        await loadModels();
      }
    } catch (err) {
      alert(err.message || '刷新失败');
    } finally {
      state.refreshBusy = false;
      els.refreshBtn.disabled = false;
      els.refreshBtn.textContent = '立即刷新';
    }
  };

  /* ========== 事件绑定 ========== */
  els.refreshBtn.addEventListener('click', refresh);

  els.search.addEventListener('input', () => {
    state.search = els.search.value;
    render();
  });

  document.querySelectorAll('th[data-sort]').forEach(th => {
    th.addEventListener('click', () => {
      const key = th.dataset.sort;
      if (state.sortKey === key) {
        state.sortDir *= -1;
      } else {
        state.sortKey = key;
        state.sortDir = key === 'name' ? 1 : -1;  // 名称默认升序，价格默认降序
      }
      render();
    });
  });

  els.currencyMode.addEventListener('click', (e) => {
    const btn = e.target.closest('button');
    if (!btn) return;
    state.currencyMode = btn.dataset.mode;
    els.currencyMode.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    render();
  });

  /* ========== 启动 ========== */
  loadModels();
})();
</script>
</body>
</html>
