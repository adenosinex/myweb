<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>模型详情 · OpenRouter Price Monitor</title>
    <style>
:root {
    --bg: #f6f7f9;
    --panel: #ffffff;
    --border: #e3e6ea;
    --text: #1a1d21;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-hover: #1d4ed8;
    --green: #059669;
    --amber: #d97706;
    --red: #dc2626;
    --row-hover: #f0f4ff;
    --radius: 8px;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", Roboto, sans-serif;
}

* { box-sizing: border-box; }

html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
}

.container {
    max-width: 1080px;
    margin: 0 auto;
    padding: 24px 20px 48px;
}

/* ---------- 顶栏 ---------- */
.topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 20px;
}
.brand { display: flex; align-items: center; gap: 10px; }
.brand .logo { color: var(--accent); font-size: 22px; }
.brand h1 { font-size: 20px; margin: 0; font-weight: 650; letter-spacing: -0.01em; }
.brand-sub { color: var(--muted); font-weight: 500; }
.actions { display: flex; gap: 8px; }

/* ---------- 按钮 ---------- */
.btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border-radius: var(--radius);
    border: 1px solid transparent;
    font-size: 13px;
    cursor: pointer;
    text-decoration: none;
    transition: background .15s, border-color .15s, color .15s;
    font-family: inherit;
}
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-hover); }
.btn-primary:disabled { background: #a5b8e8; cursor: not-allowed; }
.btn-ghost { background: var(--panel); color: var(--text); border-color: var(--border); }
.btn-ghost:hover { border-color: #c3c9d1; background: #fafbfc; }
.btn-danger { background: #fff; color: var(--red); border-color: var(--border); }
.btn-danger:hover { background: #fef2f2; border-color: #fca5a5; }

/* ---------- 元信息栏 ---------- */
.meta-bar {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    align-items: center;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 18px;
    margin-bottom: 16px;
}
.meta-item { display: flex; flex-direction: column; gap: 2px; }
.meta-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.meta-value { font-size: 13px; font-weight: 550; }

/* 状态徽章 */
.status-badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 2px 10px;
    border-radius: 20px;
    width: fit-content;
}
.status-badge::before {
    content: "";
    width: 8px; height: 8px;
    border-radius: 50%;
    background: currentColor;
}
.status-updated { color: var(--green); background: #ecfdf5; }
.status-cached { color: var(--amber); background: #fffbeb; }
.status-error { color: var(--red); background: #fef2f2; }
.status-empty { color: var(--muted); background: #f3f4f6; }

/* 分段选择器 */
.segmented { display: inline-flex; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.segmented button {
    border: none; background: var(--panel); padding: 5px 12px;
    font-size: 12px; cursor: pointer; color: var(--muted); font-family: inherit;
}
.segmented button.active { background: var(--accent); color: #fff; }
.segmented button:not(:last-child) { border-right: 1px solid var(--border); }

/* 错误横幅 */
.error-banner {
    background: #fef2f2;
    border: 1px solid #fecaca;
    color: #b91c1c;
    border-radius: var(--radius);
    padding: 10px 14px;
    margin-bottom: 16px;
    font-size: 13px;
}
.hidden { display: none !important; }

/* ---------- 工具栏 ---------- */
.toolbar { display: flex; align-items: center; gap: 14px; margin-bottom: 12px; }
.search {
    flex: 1; max-width: 340px;
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 13px; font-family: inherit;
    background: var(--panel);
}
.search:focus { outline: none; border-color: var(--accent); }
.count { color: var(--muted); font-size: 12px; }

/* ---------- 表格 ---------- */
.table-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
}
table { width: 100%; border-collapse: collapse; }
thead th {
    text-align: left;
    font-size: 12px;
    color: var(--muted);
    font-weight: 600;
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
}
thead th.sortable { cursor: pointer; user-select: none; }
thead th.sortable:hover { color: var(--text); }
thead th .caret { opacity: .5; font-size: 10px; }
thead th.sorted-asc .caret::after { content: "▲"; opacity: 1; }
thead th.sorted-desc .caret::after { content: "▼"; opacity: 1; }
tbody td { padding: 12px 16px; border-bottom: 1px solid #f0f1f3; vertical-align: top; }
tbody tr:last-child td { border-bottom: none; }
tbody tr:hover { background: var(--row-hover); }

.cell-model .name { font-weight: 600; }
.cell-model .id { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-all; }
.cell-price .amount { font-family: var(--mono); font-weight: 600; font-size: 14px; }
.cell-price .cny { font-family: var(--mono); font-size: 12px; color: var(--muted); display: block; }
.cell-price .unit { font-size: 11px; color: var(--muted); }
.cell-ctx { font-family: var(--mono); font-size: 13px; }

/* 行内状态点 */
.dot { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 550; }
.dot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; }
.dot-ok { color: var(--green); }
.dot-ok::before { background: var(--green); }
.dot-miss { color: var(--red); }
.dot-miss::before { background: var(--red); }

/* 空态 */
.empty { padding: 40px; text-align: center; color: var(--muted); }

/* ---------- 卡片（移动端） ---------- */
.cards { display: none; }
@media (max-width: 720px) {
    .table-wrap { display: none; }
    .cards { display: flex; flex-direction: column; gap: 12px; }
}
.card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
}
.card .c-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
.card .c-name { font-weight: 600; }
.card .c-id { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; margin-top: 2px; }
.card .c-grid { display: flex; gap: 24px; margin-top: 12px; }
.card .c-grid .c-col { display: flex; flex-direction: column; gap: 2px; }
.card .c-grid .c-k { font-size: 11px; color: var(--muted); }
.card .c-grid .c-v { font-family: var(--mono); font-weight: 600; }
.card .c-grid .c-v small { font-weight: 400; color: var(--muted); font-size: 11px; }

/* ---------- 设置页 ---------- */
.panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 18px;
}
.panel-title { margin: 0 0 14px; font-size: 15px; font-weight: 650; }
.form { display: flex; flex-direction: column; gap: 12px; }
.form-row { flex-direction: row; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.field { display: flex; flex-direction: column; gap: 4px; flex: 1; min-width: 220px; }
.field-inline { flex: 0; min-width: auto; flex-direction: row; align-items: center; gap: 8px; }
.field label { font-size: 12px; color: var(--muted); }
.field .hint { font-size: 11px; color: #9ca3af; font-weight: 400; }
.field input[type="text"], .field input[type="number"] {
    padding: 8px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-size: 13px;
    font-family: inherit;
}
.field input:focus { outline: none; border-color: var(--accent); }
.form-msg { font-size: 13px; margin-top: 8px; }
.form-msg.ok { color: var(--green); }
.form-msg.err { color: var(--red); }

/* 开关 */
.switch { position: relative; display: inline-block; width: 40px; height: 22px; }
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
    position: absolute; cursor: pointer; inset: 0;
    background: #d1d5db; border-radius: 22px; transition: .2s;
}
.slider::before {
    content: ""; position: absolute; height: 16px; width: 16px;
    left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .2s;
}
.switch input:checked + .slider { background: var(--accent); }
.switch input:checked + .slider::before { transform: translateX(18px); }
.switch-label { font-size: 13px; }

/* 模型列表 */
.model-list { display: flex; flex-direction: column; gap: 8px; }
.model-row {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
}
.model-row .m-info { flex: 1; min-width: 0; }
.model-row .m-name { font-weight: 600; }
.model-row .m-name input {
    font-size: 13px; padding: 2px 6px; border: 1px solid transparent; border-radius: 4px;
    font-family: inherit; width: 100%;
}
.model-row .m-name input:hover, .model-row .m-name input:focus { border-color: var(--border); outline: none; }
.model-row .m-id { font-family: var(--mono); font-size: 11px; color: var(--muted); word-break: break-all; }
.model-row.disabled { opacity: .55; }
.m-actions { display: flex; gap: 6px; align-items: center; }
.m-actions .btn { padding: 5px 10px; font-size: 12px; }

.footer { margin-top: 28px; text-align: center; color: #9ca3af; font-size: 12px; }

/* ---------- 首页：详情入口 ---------- */
.btn-sm { padding: 4px 10px; font-size: 12px; }
.cell-action { white-space: nowrap; text-align: right; }
.card .c-foot { margin-top: 12px; text-align: right; }

/* ---------- 详情页 ---------- */
.detail-head .d-head-row {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; flex-wrap: wrap;
}
.detail-head .d-name { margin: 0; font-size: 20px; font-weight: 650; }
.detail-head .d-id { font-family: var(--mono); font-size: 13px; color: var(--muted); word-break: break-all; }
.d-meta { display: flex; flex-wrap: wrap; gap: 16px; margin-top: 12px; }
.d-meta-item { display: inline-flex; gap: 6px; font-size: 12px; color: var(--muted); align-items: baseline; }

/* 键值网格 */
.kv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 10px 24px; }
.kv-item { display: flex; flex-direction: column; gap: 2px; padding: 8px 0; border-bottom: 1px solid #f0f1f3; }
.kv-k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; }
.kv-v { font-size: 14px; font-weight: 550; word-break: break-all; }
.kv-v .muted, .muted { color: var(--muted); font-size: 12px; font-weight: 400; }

.d-sub { font-size: 12px; color: var(--muted); margin: 16px 0 8px; font-weight: 600; }
.d-desc { font-size: 13px; color: var(--text); margin: 4px 0 0; line-height: 1.6; }

/* chips */
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip {
    font-family: var(--mono); font-size: 12px;
    background: #f0f4ff; color: var(--accent);
    border: 1px solid #dbe4ff; border-radius: 6px;
    padding: 2px 8px;
}

/* 统计卡片 */
.stat-cards { display: flex; flex-wrap: wrap; gap: 12px; }
.stat-card {
    flex: 1; min-width: 150px;
    background: var(--bg); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px 16px;
}
.stat-k { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.stat-v { font-family: var(--mono); font-size: 16px; font-weight: 650; }
.stat-v .cny { display: block; font-size: 12px; color: var(--muted); font-weight: 400; }

.unit-note { font-size: 12px; color: var(--muted); font-weight: 400; }

/* 可横向滚动表格（移动端） */
.table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.kv-table { min-width: 320px; }
.kv-table th, .kv-table td { padding: 10px 12px; }
.kv-table td:last-child { font-family: var(--mono); }

.d-unavailable {
    background: #f8fafc; border: 1px dashed var(--border);
    border-radius: var(--radius); padding: 14px 16px;
    color: var(--muted); font-size: 13px;
}
.d-note { font-size: 12px; color: #9ca3af; margin: 10px 0 0; }
.d-foot { margin-top: 16px; }

/* ---------- Provider 详情表格 ---------- */
.p-baseline { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.p-baseline select {
    padding: 6px 10px; border: 1px solid var(--border); border-radius: var(--radius);
    font-size: 13px; font-family: inherit; background: var(--panel);
}
.p-baseline select:focus { outline: none; border-color: var(--accent); }
.p-base-name { font-family: var(--mono); font-size: 13px; font-weight: 600; color: var(--accent); }

.provider-table { min-width: 760px; }
.provider-table th { white-space: nowrap; }
.provider-table td { font-family: var(--mono); font-size: 13px; white-space: nowrap; }
.provider-table td.p-name { font-family: var(--sans); }
.provider-table tr.is-base { background: #f0f6ff; }
.provider-table tr.is-base td.p-name .p-name-text { font-weight: 700; }

.p-name-text { font-weight: 600; }
.badge-base {
    display: inline-block; margin-left: 6px;
    font-family: var(--sans); font-size: 10px; font-weight: 700;
    color: #fff; background: var(--accent); border-radius: 4px; padding: 1px 6px;
    vertical-align: middle; letter-spacing: .03em;
}
.qtag {
    display: inline-block; margin-left: 6px;
    font-family: var(--mono); font-size: 10px; color: var(--muted);
    background: #f3f4f6; border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px;
    vertical-align: middle;
}

/* 价格差异百分比（更便宜=绿，更贵=红） */
.diff { font-family: var(--mono); font-size: 11px; margin-left: 4px; }
.diff-neg { color: var(--green); }
.diff-pos { color: var(--red); }
.diff-zero { color: var(--muted); }

.dot-warn { color: var(--amber); }
.dot-warn::before { background: var(--amber); }

@media (max-width: 720px) {
    .kv-grid { grid-template-columns: 1fr; }
    .stat-cards { flex-direction: column; }
}

</style>
</head>
<body>
    <div class="container">
        <header class="topbar">
            <div class="brand">
                <span class="logo">◈</span>
                <h1>模型详情</h1>
            </div>
            <div class="actions">
                <div class="segmented" id="currency-mode">
                    <button data-mode="usd">USD</button>
                    <button data-mode="both" class="active">USD+CNY</button>
                    <button data-mode="cny">CNY</button>
                </div>
                <a href="{{ url_for('openrouter.index') }}" class="btn btn-ghost">← 返回首页</a>
            </div>
        </header>

        <div class="empty" id="detail-loading">加载中…</div>

        <div class="error-banner hidden" id="detail-error"></div>

        <div id="detail-content" class="hidden"></div>

        <footer class="footer">
            <span>数据源：OpenRouter Official API · 仅本地部署 · 价格单位 USD / 1M tokens</span>
        </footer>
    </div>

    <script>window.BASE_PATH = {{ url_for('openrouter.index')|tojson }};</script>
    <script>window.MODEL_ID = {{ model_id|tojson }};</script>
    <script>{% raw %}
/* OpenRouter Price Monitor — 模型详情页逻辑（原生 JS，无外部依赖）
 * 数据来源：/api/models/<model_id>（仅读 cache.json，与首页一致）。
 * 逐 Provider 明细来自后台刷新时写入缓存的 model.providers 字段。
 */
(function () {
    "use strict";

    var MODEL_ID = window.MODEL_ID || "";
    var BASE = window.BASE_PATH || "/"; // 蓝图 URL 前缀，形如 "/openrouter/"
    var state = {
        data: null,
        currencyMode: "both", // usd | cny | both
        baseline: "auto",     // "auto" 或某个 provider name
    };

    var els = {
        loading: document.getElementById("detail-loading"),
        error: document.getElementById("detail-error"),
        content: document.getElementById("detail-content"),
        currencyMode: document.getElementById("currency-mode"),
    };

    /* ---------- 工具函数 ---------- */
    function escapeHtml(s) {
        return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
            return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
        });
    }

    function fmtUsd(v) {
        if (v === null || v === undefined || isNaN(v)) return "—";
        if (v === 0) return "$0";
        if (v < 0.001) return "$" + v.toExponential(2);
        if (v < 1) return "$" + v.toFixed(3).replace(/0+$/, "").replace(/\.$/, "");
        return "$" + v.toFixed(2);
    }

    function fmtCny(v, rate) {
        if (v === null || v === undefined || isNaN(v)) return "—";
        var c = v * (rate || 7.2);
        if (c < 0.01) return "¥" + c.toFixed(4).replace(/0+$/, "").replace(/\.$/, "");
        return "¥" + c.toFixed(2);
    }

    function fmtCtx(n) {
        if (n === null || n === undefined) return "—";
        if (n >= 1e6) return trimZero(n / 1e6) + "M";
        if (n >= 1e3) return trimZero(n / 1e3) + "K";
        return String(n);
    }
    function trimZero(x) {
        return x.toFixed(x >= 100 ? 0 : 1).replace(/\.0$/, "");
    }

    function fmtTime(iso) {
        if (!iso) return "—";
        var d = new Date(iso);
        if (isNaN(d.getTime())) return iso;
        var p = function (n) { return (n < 10 ? "0" : "") + n; };
        return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) +
            " " + p(d.getHours()) + ":" + p(d.getMinutes()) + ":" + p(d.getSeconds());
    }

    function fmtDate(ts) {
        if (ts === null || ts === undefined || isNaN(ts)) return null;
        var d = new Date(Number(ts) * 1000);
        if (isNaN(d.getTime())) return null;
        var p = function (n) { return (n < 10 ? "0" : "") + n; };
        return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate());
    }

    function fmtPct(pct) {
        if (pct === null || pct === undefined || isNaN(pct)) return null;
        var sign = pct > 0 ? "+" : "";
        return sign + pct.toFixed(1) + "%";
    }

    function fmtLatency(ms) {
        if (ms === null || ms === undefined || isNaN(ms)) return "—";
        if (ms >= 1000) return trimZero(ms / 1000) + "s";
        return ms + " ms";
    }

    function fmtThroughput(tps) {
        if (tps === null || tps === undefined || isNaN(tps)) return "—";
        return tps + " tok/s";
    }

    function fmtUptime(pct) {
        if (pct === null || pct === undefined || isNaN(pct)) return "—";
        return pct.toFixed(2) + "%";
    }

    // 卡片价格（USD + 换行 CNY）
    function priceCell(v, rate) {
        if (v === null || v === undefined || isNaN(v)) return "—";
        if (state.currencyMode === "cny") return fmtCny(v, rate);
        if (state.currencyMode === "usd") return fmtUsd(v);
        return fmtUsd(v) + " <span class='cny'>≈ " + escapeHtml(fmtCny(v, rate)) + "</span>";
    }

    // 表格价格（紧凑，单行）
    function priceShort(v, rate) {
        if (v === null || v === undefined || isNaN(v)) return "—";
        if (state.currencyMode === "cny") return fmtCny(v, rate);
        if (state.currencyMode === "usd") return fmtUsd(v);
        return fmtUsd(v) + " / " + fmtCny(v, rate);
    }

    /* ---------- 状态徽章 ---------- */
    function statusBadge(status, found) {
        var map = {
            updated: { text: "Fresh", cls: "status-updated" },
            cached: { text: "Cached", cls: "status-cached" },
        };
        var m = map[status] || { text: "Error", cls: "status-error" };
        if (!found) { m = { text: "未找到", cls: "status-error" }; }
        return '<span class="status-badge ' + m.cls + '">' + m.text + '</span>';
    }

    function providerStatusLabel(s) {
        if (s === 0) return '<span class="dot dot-ok">Stable</span>';
        if (s === 1) return '<span class="dot dot-warn">Unstable</span>';
        if (s === 2) return '<span class="dot dot-miss">Down</span>';
        return "—";
    }

    /* ---------- Provider 表格 ---------- */
    function resolveBaseline(providers) {
        if (state.baseline !== "auto") {
            for (var i = 0; i < providers.length; i++) {
                if (providers[i].name === state.baseline) return providers[i];
            }
        }
        return providers[0]; // auto = 第一个（通常最便宜/默认）
    }

    function priceWithDiff(val, baseVal, rate) {
        var s = priceShort(val, rate);
        if (val !== null && val !== undefined && !isNaN(val) &&
            baseVal !== null && baseVal !== undefined && !isNaN(baseVal) && baseVal !== 0) {
            var pct = (val / baseVal - 1) * 100;
            var cls = Math.abs(pct) < 0.05 ? "diff-zero" : (pct < 0 ? "diff-neg" : "diff-pos");
            s += ' <span class="diff ' + cls + '">' + fmtPct(pct) + '</span>';
        }
        return s;
    }

    function renderProviders(m, rate) {
        var providers = m.providers || [];
        if (!providers.length) {
            return '<section class="panel"><h2 class="panel-title">Provider 详情</h2>' +
                '<div class="d-unavailable">该模型暂无逐 Provider 明细数据。</div></section>';
        }

        var base = resolveBaseline(providers);
        var baseName = base ? base.name : "";

        var options = '<option value="auto">Auto（最便宜 / 默认）</option>';
        for (var i = 0; i < providers.length; i++) {
            options += '<option value="' + escapeHtml(providers[i].name) + '">' + escapeHtml(providers[i].name) + '</option>';
        }

        var rows = "";
        for (var j = 0; j < providers.length; j++) {
            var p = providers[j];
            var isBase = p.name === baseName;
            var qtag = (p.quantization && p.quantization !== "unknown") ? '<span class="qtag">' + escapeHtml(p.quantization) + '</span>' : '';
            rows += '<tr' + (isBase ? ' class="is-base"' : '') + '>' +
                '<td class="p-name"><span class="p-name-text">' + escapeHtml(p.name) + '</span>' +
                (isBase ? '<span class="badge-base">BASE</span>' : '') + qtag + '</td>' +
                '<td>' + priceWithDiff(p.input_price, base ? base.input_price : null, rate) + '</td>' +
                '<td>' + priceWithDiff(p.output_price, base ? base.output_price : null, rate) + '</td>' +
                '<td>' + priceWithDiff(p.cache_read_price, base ? base.cache_read_price : null, rate) + '</td>' +
                '<td>' + escapeHtml(fmtLatency(p.latency_ms)) + '</td>' +
                '<td>' + escapeHtml(fmtThroughput(p.throughput_tps)) + '</td>' +
                '<td>' + escapeHtml(fmtUptime(p.uptime_1d != null ? p.uptime_1d : p.uptime_30m)) + '</td>' +
                '<td>' + providerStatusLabel(p.status) + '</td>' +
                '</tr>';
        }

        return '<section class="panel"><h2 class="panel-title">Provider 详情 <span class="unit-note">(' + providers.length + ' 个)</span></h2>' +
            '<div class="p-baseline">' +
            '<span class="meta-label">Baseline Provider</span>' +
            '<select id="baseline-select">' + options + '</select>' +
            '<span class="p-base-name" id="baseline-name">' + escapeHtml(baseName) + '</span>' +
            '</div>' +
            '<div class="table-scroll"><table class="provider-table"><thead><tr>' +
            '<th>Provider</th><th>Input</th><th>Output</th><th>Cache Read</th>' +
            '<th>Latency</th><th>Throughput</th><th>Uptime</th><th>Status</th>' +
            '</tr></thead><tbody>' + rows + '</tbody></table></div>' +
            '<p class="d-note">注：价格为 USD / 1M tokens；百分比为相对基准 Provider 的差异（负数=更便宜）。' +
            'OpenRouter 当前 endpoints 接口未返回 Cache Create（缓存写入）及 5m 分层缓存价格；Latency / Throughput 多数 Provider 尚未上报，无数据显示「—」。</p>' +
            '</section>';
    }

    /* ---------- 渲染 ---------- */
    function render() {
        var d = state.data;
        if (!d) return;
        var m = d.model || {};
        var rate = d.usd_cny_rate != null ? d.usd_cny_rate : 7.2;
        var found = !!d.found;

        var html = "";

        html += '<section class="panel detail-head">' +
            '<div class="d-head-row">' +
            '<div><h2 class="d-name">' + escapeHtml(d.name) + '</h2>' +
            '<div class="d-id">' + escapeHtml(d.id) + '</div></div>' +
            '<div>' + statusBadge(d.status, found) + '</div>' +
            '</div>' +
            '<div class="d-meta">' +
            '<span class="d-meta-item"><span class="meta-label">数据来源</span> ' + escapeHtml(d.source || "OpenRouter Official API") + '</span>' +
            '<span class="d-meta-item"><span class="meta-label">数据更新时间</span> ' + escapeHtml(fmtTime(d.updated_at || d.fetched_at)) + '</span>' +
            '</div>' +
            '</section>';

        if (!found) {
            html += '<div class="error-banner">该模型未在 OpenRouter API 中找到（或尚未获取到数据）。以下为当前可用的基本信息。</div>';
        }

        // 基本信息
        html += '<section class="panel"><h2 class="panel-title">基本信息</h2><div class="kv-grid">';
        html += kv("Model ID", d.id);
        html += kv("Context Length", m.context_length != null ? escapeHtml(fmtCtx(m.context_length)) + ' <span class="muted">(' + escapeHtml(String(m.context_length)) + ' tokens)</span>' : null);
        html += kv("Modality", m.modality ? escapeHtml(m.modality) : (m.architecture ? escapeHtml(m.architecture) : null));
        html += kv("Architecture", m.architecture ? escapeHtml(m.architecture) : null);
        html += kv("Tokenizer", m.tokenizer ? escapeHtml(m.tokenizer) : null);
        html += kv("Input Modalities", m.input_modalities && m.input_modalities.length ? escapeHtml(m.input_modalities.join(", ")) : null);
        html += kv("Output Modalities", m.output_modalities && m.output_modalities.length ? escapeHtml(m.output_modalities.join(", ")) : null);
        html += kv("Released", fmtDate(m.created));
        html += kv("Knowledge Cutoff", m.knowledge_cutoff ? escapeHtml(String(m.knowledge_cutoff)) : null);
        html += '</div>';

        if (m.supported_parameters && m.supported_parameters.length) {
            html += '<div class="d-sub">Supported Parameters</div><div class="chips">' +
                m.supported_parameters.map(function (p) { return '<span class="chip">' + escapeHtml(p) + '</span>'; }).join("") +
                '</div>';
        }

        if (m.top_provider && Object.keys(m.top_provider).length) {
            var tp = m.top_provider;
            html += '<div class="d-sub">Top Provider</div><div class="kv-grid">';
            if (tp.context_length != null) html += kv("Context Length", escapeHtml(fmtCtx(tp.context_length)) + " (" + escapeHtml(String(tp.context_length)) + ")");
            if (tp.max_completion_tokens != null) html += kv("Max Completion Tokens", escapeHtml(String(tp.max_completion_tokens)));
            if (tp.is_moderated != null) html += kv("Is Moderated", tp.is_moderated ? "Yes" : "No");
            html += '</div>';
        }

        if (m.description) {
            html += '<div class="d-sub">描述</div><p class="d-desc">' + escapeHtml(m.description) + '</p>';
        }
        html += '</section>';

        // Base Pricing（模型级代表价格 + 缓存读取）
        html += '<section class="panel"><h2 class="panel-title">Base Pricing <span class="unit-note">USD / 1M tokens</span></h2>' +
            '<div class="stat-cards">' +
            '<div class="stat-card"><div class="stat-k">Input 输入</div><div class="stat-v">' + priceCell(m.input_price, rate) + '</div></div>' +
            '<div class="stat-card"><div class="stat-k">Output 输出</div><div class="stat-v">' + priceCell(m.output_price, rate) + '</div></div>' +
            '<div class="stat-card"><div class="stat-k">Cache Read 缓存读取</div><div class="stat-v">' + priceCell(m.cache_read_price, rate) + '</div></div>' +
            '</div></section>';

        // Provider 详情（逐 Provider 价格 / 延迟 / 吞吐 / Uptime / 状态）
        html += renderProviders(m, rate);

        // Effective Pricing
        html += '<section class="panel"><h2 class="panel-title">Effective Pricing</h2>' +
            '<div class="d-unavailable">Effective Pricing unavailable</div>' +
            '<p class="d-note">Effective Pricing（加权平均价）、Cache Hit Rate、Token Share 属于 OpenRouter 的实际统计指标，当前未在数据中提供。</p>' +
            '</section>';

        els.content.innerHTML = html;

        // 绑定基准 Provider 选择器
        var sel = document.getElementById("baseline-select");
        if (sel) {
            sel.value = state.baseline;
            sel.addEventListener("change", function () {
                state.baseline = sel.value;
                render();
            });
        }
    }

    function kv(label, value) {
        if (value === null || value === undefined || value === "") return "";
        return '<div class="kv-item"><div class="kv-k">' + escapeHtml(label) + '</div><div class="kv-v">' + value + '</div></div>';
    }

    /* ---------- 加载 ---------- */
    function showNotFound() {
        els.loading.classList.add("hidden");
        els.error.classList.remove("hidden");
        els.error.textContent = "Model not found";
        els.content.classList.remove("hidden");
        els.content.innerHTML =
            '<section class="panel"><div class="empty">' +
            '模型「' + escapeHtml(MODEL_ID) + '」不存在（不在 models.json 或 cache.json 中）。' +
            '</div><div class="d-foot"><a class="btn btn-primary" href="' + BASE + '">返回首页</a></div></section>';
    }

    function load() {
        fetch(BASE + "api/models/" + MODEL_ID).then(function (r) {
            if (r.status === 404) { showNotFound(); throw new Error("__404__"); }
            return r.json();
        }).then(function (data) {
            if (!data || data.error) { showNotFound(); return; }
            state.data = data;
            els.loading.classList.add("hidden");
            els.content.classList.remove("hidden");
            render();
        }).catch(function (err) {
            if (err && err.message === "__404__") return;
            els.loading.classList.add("hidden");
            els.error.classList.remove("hidden");
            els.error.textContent = "加载失败：" + (err && err.message ? err.message : "无法连接本地服务");
        });
    }

    /* ---------- 事件 ---------- */
    els.currencyMode.addEventListener("click", function (e) {
        var btn = e.target.closest("button");
        if (!btn) return;
        state.currencyMode = btn.getAttribute("data-mode");
        els.currencyMode.querySelectorAll("button").forEach(function (b) {
            b.classList.toggle("active", b === btn);
        });
        render();
    });

    load();
})();

{% endraw %}</script>
</body>
</html>
