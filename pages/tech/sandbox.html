        // ==================== 网状图 ====================
        function renderGraph() {
            const container = document.getElementById('graph-container');
            if (!container || currentDisplayView !== 'graph') return;
            container.style.display = 'block';
            if (!chartInstance) chartInstance = echarts.init(container);
            const filtered = filterPages(currentPagesData);
            const nodes = [],
                links = [];
            const categoriesSet = new Set(),
                tagCounts = {};
            filtered.forEach(page => {
                let folder = page.folder || '未分类';
                tagCounts[folder] = (tagCounts[folder] || 0) + 1;
            });
            filtered.forEach(page => {
                let folder = page.folder || '未分类';
                categoriesSet.add(folder);
                if (!nodes.find(n => n.id === 'TAG_' + folder)) {
                    const count = tagCounts[folder];
                    nodes.push({
                        id: 'TAG_' + folder,
                        name: folder,
                        value: count,
                        symbolSize: Math.min(100, 40 + count * 5),
                        category: folder,
                        itemStyle: { borderWidth: 3, borderColor: '#fff', shadowBlur: 10,
                            shadowColor: 'rgba(0,0,0,0.3)' },
                        label: { show: true, formatter: '{b}\n({c})', fontSize: 15,
                        fontWeight: 'bold' }
                    });
                }
                links.push({ source: page.id, target: 'TAG_' + folder });
                nodes.push({
                    id: page.id,
                    name: page.title,
                    symbolSize: 18,
                    category: folder,
                    url: `${API_BASE}/view/${page.id}`,
                    label: { show: true, position: 'right', formatter: '{b}' }
                });
            });
            const categories = Array.from(categoriesSet).map(name => ({ name }));
            const option = {
                tooltip: {
                    formatter: function(p) {
                        if (p.data.id && p.data.id.startsWith('TAG_'))
                            return `📁 <b>${p.data.name}</b><br/>共聚集了 ${p.data.value} 个项目`;
                        const page = filtered.find(pp => pp.id === p.data.id);
                        return `${page ? resolveIcon(page) : '📄'} ${p.data.name}`;
                    }
                },
                legend: { data: categories.map(c => c.name), type: 'scroll', bottom: 10 },
                animationDurationUpdate: 1500,
                animationEasingUpdate: 'quinticInOut',
                series: [{
                    type: 'graph',
                    layout: 'force',
                    force: { repulsion: 400, edgeLength: [50, 100] },
                    data: nodes,
                    links: links,
                    categories: categories,
                    roam: true,
                    label: { position: 'right' },
                    lineStyle: { color: 'source', curveness: 0.1 }
                }]
            };
            chartInstance.setOption(option);
            chartInstance.off('click');
            chartInstance.on('click', function(p) { if (p.data && p.data.url) window.open(p.data.url, '_blank'); });
            updateResultCount(filtered, currentPagesData.length);
        }

        // ==================== 工具箱 ====================
        function toggleToolbox() {
            toolboxVisible = !toolboxVisible;
            document.getElementById('toolbox-panel').classList.toggle('active', toolboxVisible);
        }

        // ==================== 编辑/删除 ====================
        function loadEditData(pageId) {
            fetch(`${API_BASE}/api/pages/${pageId}`)
                .then(res => res.json())
                .then(data => {
                    if (data.error) return alert(data.error);
                    document.getElementById('edit-id').value = data.id;
                    document.getElementById('edit-title').value = data.title || '';
                    document.getElementById('edit-icon').value = data.icon || '';
                    document.getElementById('edit-folder').value = data.folder || '';
                    document.getElementById('edit-tags').value = data.tags || '';
                    document.getElementById('edit-html').value = data.html_content || '';
                }).catch(err => alert("读取失败"));
        }

        function deletePage() {
            const pageId = document.getElementById('edit-id').value;
            if (!pageId) return;
            if (!confirm('⚠️ 确定要彻底删除该项目文件吗？此操作不可恢复。')) return;
            fetch(`${API_BASE}/api/pages/${pageId}`, { method: 'DELETE' })
                .then(r => r.json()).then(d => {
                    if (d.status === 'success') {
                        // 清理时间戳记录
                        const ts = getTimestamps();
                        delete ts[pageId];
                        saveTimestamps(ts);
                        showToast('🗑️ 物理文件已删除');
                        switchView('list');
                    } else { alert('删除失败: ' + d.error); }
                }).catch(err => alert("请求失败"));
        }

        // ==================== 表单提交 ====================
        document.getElementById('upload-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const titleValue = document.getElementById('upload-title').value.trim();
            let iconValue = document.getElementById('upload-icon').value.trim(),
                htmlValue = document.getElementById('upload-html').value;
            if (!iconValue) {
                iconValue = getDefaultIcon(titleValue || 'new');
                htmlValue = injectIconToHtml(htmlValue, iconValue, titleValue);
            }
            fetch(`${API_BASE}/api/pages`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: titleValue,
                        icon: iconValue,
                        folder: document.getElementById('upload-folder').value,
                        tags: document.getElementById('upload-tags').value,
                        html_content: htmlValue
                    })
                })
                .then(r => r.json())
                .then(d => {
                    if (d.status === 'success') {
                        // 记录新项目时间戳
                        if (d.id) recordPageTimestamp(d.id);
                        // 如果后端返回了完整页面数据，也尝试记录
                        if (d.page && d.page.id) recordPageTimestamp(d.page.id);
                        showToast('✅ 项目已部署 (可在上方返回列表)');
                        // 延迟加载以获取新ID
                        setTimeout(() => loadPages(), 500);
                    } else alert(d.error);
                });
        });

        document.getElementById('edit-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const pageId = document.getElementById('edit-id').value,
                titleValue = document.getElementById('edit-title').value.trim();
            let iconValue = document.getElementById('edit-icon').value.trim(),
                htmlValue = document.getElementById('edit-html').value;
            if (!iconValue) {
                iconValue = getDefaultIcon(pageId || titleValue || 'edit');
                htmlValue = injectIconToHtml(htmlValue, iconValue, titleValue);
            }
            fetch(`${API_BASE}/api/pages/${pageId}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        title: titleValue,
                        icon: iconValue,
                        folder: document.getElementById('edit-folder').value,
                        tags: document.getElementById('edit-tags').value,
                        html_content: htmlValue
                    })
                })
                .then(r => r.json())
                .then(d => {
                    if (d.status === 'success') { showToast('✅ 代码已更新并保存'); } else alert(d.error);
                });
        });

        // ==================== CSV 导入导出 ====================
        function exportCSV() { window.location.href = `${API_BASE}/api/export_untagged`;
            showToast('开始下载 CSV 文件'); }

        function importCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
            const formData = new FormData();
            formData.append('file', file);
            fetch(`${API_BASE}/api/import_tags`, { method: 'POST', body: formData })
                .then(r => r.json()).then(d => { if (d.status === 'success') { showToast(
                        `✅ 成功更新了 ${d.updated} 个项目`);
                        loadPages(); } else alert(d.error); })
                .catch(err => alert("上传处理失败"));
            event.target.value = '';
        }

        function exportIconCSV() {
            if (!currentPagesData.length) { alert('暂无数据'); return; }
            let csv = 'id,title,icon,html_preview\n';
            currentPagesData.forEach(page => {
                const preview = (page.html_content || '').replace(/\n/g, ' ').replace(/,/g, '，').substring(0, 200);
                csv +=
                    `"${page.id || ''}","${(page.title || '').replace(/,/g, '，')}","${page.icon || ''}","${preview}"\n`;
            });
            const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = 'icon_export.csv';
            link.click();
            showToast('图标CSV已导出');
        }

        async function importIconCSV(event) {
            const file = event.target.files[0];
            if (!file) return;
            const text = await file.text();
            const lines = text.split('\n').filter(line => line.trim() !== '');
            if (lines.length < 2) { alert('CSV格式错误');
                event.target.value = ''; return; }
            const header = lines[0].split(',');
            const idIdx = header.findIndex(h => h.trim().toLowerCase() === 'id');
            const iconIdx = header.findIndex(h => h.trim().toLowerCase() === 'icon');
            if (idIdx === -1 || iconIdx === -1) { alert('CSV需包含id和icon列');
                event.target.value = ''; return; }
            let updatedCount = 0;
            for (let i = 1; i < lines.length; i++) {
                const cols = lines[i].split(',');
                if (cols.length <= Math.max(idIdx, iconIdx)) continue;
                const csvId = cols[idIdx].replace(/^"|"$/g, '').trim();
                const csvIcon = cols[iconIdx].replace(/^"|"$/g, '').trim();
                if (!csvId) continue;
                const page = currentPagesData.find(p => p.id == csvId || p.title === csvId);
                if (!page) continue;
                try {
                    const res = await fetch(`${API_BASE}/api/pages/${page.id}`);
                    const pageDetail = await res.json();
                    if (!pageDetail.error) {
                        const resp = await fetch(`${API_BASE}/api/pages/${page.id}`, {
                            method: 'PUT',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                title: pageDetail.title,
                                icon: csvIcon,
                                folder: pageDetail.folder,
                                tags: pageDetail.tags,
                                html_content: pageDetail.html_content
                            })
                        });
                        if ((await resp.json()).status === 'success') updatedCount++;
                    }
                } catch (e) {}
            }
            showToast(`✅ 成功更新了 ${updatedCount} 个图标`);
            loadPages();
            event.target.value = '';
        }

        // ==================== HTML 转义辅助 ====================
        function escapeHtml(str) {
            if (!str) return '';
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
        }

        function escapeAttr(str) {
            if (!str) return '';
            return str.replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/'/g, '&#39;').replace(/</g, '&lt;').replace(/>/g,
                '&gt;');
        }

        // ==================== 初始化 ====================
        window.addEventListener('resize', () => { if (chartInstance && currentDisplayView === 'graph') chartInstance
                .resize(); });
        window.onload = () => {
            switchView('list');
            currentDisplayView = 'grid';
            document.querySelectorAll('#view-tabs .view-tab').forEach(tab => {
                tab.classList.toggle('active', tab.getAttribute('data-view') === 'grid');
            });
        };

        // 点击弹窗遮罩关闭
        document.getElementById('move-modal').addEventListener('click', function(e) {
            if (e.target === this) closeMoveModal();
        });

        // 键盘快捷键：ESC关闭弹窗、Ctrl+F聚焦搜索
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') {
                closeMoveModal();
                clearBatchSelection();
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
                // 不阻止默认，但也聚焦我们的搜索框
                if (document.getElementById('view-list').classList.contains('active')) {
                    e.preventDefault();
                    document.getElementById('search-input').focus();
                }
            }
            if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
                if (document.getElementById('view-list').classList.contains('active')) {
                    e.preventDefault();
                    document.getElementById('search-input').focus();
                }
            }
        });
    </script>
</body>
</html>
